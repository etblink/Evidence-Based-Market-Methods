name: AUDIT-004 TSMOM stage A

on:
  push:
    branches: [main]
    paths:
      - "tools/audit_004_stage_a.py"
      - ".github/workflows/audit-004-stage-a.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install workbook dependencies
        run: python -m pip install --disable-pip-version-check pandas openpyxl

      - name: Run frozen AUDIT-004 Stage A
        run: python tools/audit_004_stage_a.py

      - name: Upload audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: audit-004-stage-a
          path: audit-output/
          if-no-files-found: error
          retention-days: 30
