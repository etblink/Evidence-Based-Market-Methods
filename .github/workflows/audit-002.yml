name: AUDIT-002 official French data

on:
  push:
    branches: [main]
    paths:
      - "tools/audit_002.py"
      - ".github/workflows/audit-002.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run frozen AUDIT-002
        run: python tools/audit_002.py

      - name: Upload audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: audit-002-results
          path: audit-output/
          if-no-files-found: error
          retention-days: 30
