schema_version: 1

project:
  name: Evidence-Based Market Methods
  status: active
  phase: reconnaissance
  objective: >-
    Determine which, if any, market methods are sufficiently evidence-supported,
    economically exploitable, and practically accessible to an individual to
    merit further experimentation or real-world consideration, given finite time
    and capital.

research:
  status: historical_reconnaissance_complete

  reconnaissance:
    universe_version: 1
    classification_principle: >-
      Partition methods primarily by information source or economic mechanism,
      not by marketing label or implementation style, to reduce overlap and
      double-counting.

    evidence_snapshots:
      - evidence/RECON-002-FIRST-PASS.md
      - evidence/RECON-003-FUND-PRICE.md
      - evidence/RECON-004-EVENT-MACRO-INFO.md
      - evidence/SYNTH-001-IMPLEMENTABILITY.md
      - evidence/AUDIT-001-FACTOR-SURVIVABILITY.md
      - evidence/AUDIT-002-LONG-ONLY.md
      - evidence/AUDIT-003-PRODUCT-UNIVERSE.md
      - evidence/AUDIT-003-DATA-INTEGRITY.md
      - evidence/SYNTH-002-EARNINGS-VS-TREND.md
      - evidence/AUDIT-004-STAGE-A.md
      - evidence/AUDIT-004-STAGE-B.md
      - evidence/SYNTH-003-HISTORICAL-STOP.md

    method_families:
      BENCH:
        name: Passive market exposure
        role: benchmark
        scope: >-
          Broad, low-cost market exposure used as the default opportunity-cost
          comparator for active methods.

      FUND:
        name: Fundamental corporate information
        role: candidate
        scope: >-
          Methods based on business economics, valuation, accounting information,
          profitability, quality, investment, earnings, revisions, and related
          company fundamentals; includes both discretionary intrinsic-value work
          and systematic fundamental signals.

      PRICE:
        name: Price and volume dynamics
        role: candidate
        scope: >-
          Methods based primarily on historical prices, returns, volume, or market
          action, including momentum, trend, mean reversion, breakouts, indicators,
          chart patterns, and discretionary technical analysis.

      EVENT:
        name: Event-driven and special situations
        role: candidate
        scope: >-
          Methods centered on identifiable corporate or market events such as
          mergers, spinoffs, restructurings, tender offers, earnings events, and
          other discrete catalysts.

      MACRO:
        name: Macro and cross-asset premia
        role: candidate
        scope: >-
          Methods based on macroeconomic conditions, rates, inflation, growth,
          currencies, commodities, carry, term structure, valuation, and tactical
          allocation across asset classes.

      STAT:
        name: Statistical and relative-value relationships
        role: candidate
        scope: >-
          Methods based on repeatable statistical relationships among securities
          or markets, including pairs, cross-sectional models, mean-reverting
          spreads, statistical arbitrage, and other relative-value structures not
          better classified by a more specific information source.

      DERIV:
        name: Derivatives and volatility
        role: candidate
        scope: >-
          Methods whose primary edge or risk exposure arises from options,
          volatility, skew, term structure, convexity, dispersion, or related
          derivative pricing relationships.

      MICRO:
        name: Microstructure and liquidity
        role: candidate
        scope: >-
          Methods based on spreads, order flow, liquidity provision, execution,
          latency, market making, or short-horizon market microstructure effects.

      INFO:
        name: Specialized information and alternative data
        role: candidate
        scope: >-
          Methods based on domain expertise, underfollowed securities, primary
          research, news or sentiment processing, positioning or flow data,
          alternative datasets, or other informational advantages not captured
          above.

    screening_protocol:
      purpose: >-
        Eliminate weak or impractical branches cheaply before authorizing deep
        experiments.

      dimensions:
        - empirical_reality
        - plausible_mechanism
        - out_of_sample_and_post_publication_robustness
        - net_economics_after_costs_and_risk
        - individual_accessibility
        - time_and_learning_cost
        - scalability_and_capacity
        - testability
        - benchmark_comparison

      allowed_dispositions:
        - retain
        - defer
        - reject
        - benchmark_only

      allowed_confidence:
        - high
        - moderate
        - low
        - insufficient

      experiment_candidate_values:
        - provisional
        - no

      comparison_rule: >-
        No family or subfamily earns deep experimentation merely because an effect
        exists. It must also present a plausible, accessible, decision-relevant
        path that can justify the required time, capital, and complexity.

    preliminary_assessments:
      BENCH:
        disposition: benchmark_only
        confidence: high
        rationale: >-
          Low-cost passive exposure is the necessary opportunity-cost baseline.
          Persistent active-manager underperformance makes it inappropriate to
          judge an active method only by whether it has positive raw returns.
        evidence:
          - EV-BENCH-001
          - EV-BENCH-002

      FUND:
        disposition: retain
        confidence: moderate
        rationale: >-
          Valuation, profitability, accounting quality, and earnings-related
          information have substantial empirical support and coherent economic
          links to the underlying businesses, while large anomaly-replication
          exercises show that many individual fundamental signals do not survive.
          The family merits decomposition rather than blanket acceptance.
        evidence:
          - EV-FUND-001
          - EV-FUND-002
          - EV-FUND-003
          - EV-GEN-001

      PRICE:
        disposition: retain
        confidence: high
        rationale: >-
          Momentum and trend persistence have unusually broad evidence, whereas
          large-scale tests of mined technical rules show weak persistence and
          strong cost sensitivity. Retention applies primarily because robust
          price-based subfamilies exist, not because technical analysis as a whole
          is validated.
        evidence:
          - EV-PRICE-001
          - EV-PRICE-002
          - EV-PRICE-003
          - EV-PRICE-004

      EVENT:
        disposition: retain
        confidence: moderate
        rationale: >-
          Post-earnings drift and merger arbitrage have documented mechanisms and
          historical return evidence, but merger spreads embed completion and
          crash risk and several broader corporate-event anomalies weaken under
          better controls. Specific event types must be evaluated separately.
        evidence:
          - EV-EVENT-001
          - EV-EVENT-002
          - EV-EVENT-003
          - EV-EVENT-004

      MACRO:
        disposition: retain
        confidence: moderate
        rationale: >-
          Cross-asset carry, value, and momentum premia have meaningful evidence,
          but generic aggregate-market forecasting has poor out-of-sample history.
          Retention therefore concerns systematic cross-asset premia rather than
          discretionary macro prediction in general.
        evidence:
          - EV-MACRO-001
          - EV-MACRO-002
          - EV-MACRO-003

      STAT:
        disposition: defer
        confidence: moderate
        rationale: >-
          Statistical relative-value effects can exist, but realistic transaction
          costs, shorting requirements, estimation error, and competition make
          individual accessibility uncertain enough that this is not a current
          priority.
        evidence:
          - EV-STAT-001
          - EV-STAT-002

      DERIV:
        disposition: defer
        confidence: high
        rationale: >-
          Volatility and variance risk premia are real and economically meaningful,
          but much of the apparent return is compensation for severe adverse-state
          risk, while option microstructure makes inference and implementation
          unusually demanding. The family is not rejected, but it is a poor early
          use of scarce research time.
        evidence:
          - EV-DERIV-001
          - EV-DERIV-002
          - EV-DERIV-003

      MICRO:
        disposition: defer
        confidence: high
        rationale: >-
          Microstructure frictions and latency effects are real, but direct
          exploitation depends heavily on speed, infrastructure, execution access,
          and specialized competition. Its immediate relevance to an ordinary
          individual is mainly execution quality rather than a primary alpha
          program.
        evidence:
          - EV-MICRO-001
          - EV-MICRO-002

      INFO:
        disposition: retain
        confidence: low
        rationale: >-
          Analyst actions, news, sentiment, and specialized information sometimes
          predict returns, and informational specialization is a plausible source
          of individual advantage. Evidence is heterogeneous, data can be costly,
          and modern competition may erode signals quickly, so accessibility and
          durability remain unresolved.
        evidence:
          - EV-INFO-001
          - EV-INFO-002
          - EV-INFO-003

    subfamily_assessments:
      FUND_VALUE:
        family: FUND
        name: Systematic value and fundamentals-based valuation
        disposition: retain
        confidence: moderate
        experiment_candidate: no
        rationale: >-
          Value has broad international evidence and fundamentals-based valuation
          residuals have predicted returns beyond common controls, but the frozen
          HML survivability audit was weak over 2016-01 through 2026-06: its
          arithmetic mean was only slightly positive, compounded factor return was
          negative, and maximum drawdown exceeded 50%. Value remains scientifically
          credible but does not justify priority in the next implementation gate.
        evidence:
          - EV-FUND-VALUE-001
          - EV-FUND-VALUE-002
          - EV-FUND-VALUE-003
          - evidence/AUDIT-001-FACTOR-SURVIVABILITY.md

      FUND_QUALITY_PROFITABILITY:
        family: FUND
        name: Profitability and quality
        disposition: retain
        confidence: high
        experiment_candidate: no
        rationale: >-
          Profitability and composite quality signals have strong research support,
          and AUDIT-002 found a clear long-only large-stock research-portfolio
          result. AUDIT-003, however, did not produce robust product-level evidence
          sufficient to justify an expensive raw-security replication. The frozen
          Yahoo ETF gate was invalidated by an official-return cross-check failure
          for SPHQ; official 2020-2025 returns place JQUA modestly behind VTI and
          SPHQ only slightly ahead. The accessible implementation edge is therefore
          weak and source/period sensitive. Retain the method scientifically but
          defer deeper implementation work.
        evidence:
          - EV-FUND-QP-001
          - EV-FUND-QP-002
          - EV-FUND-QP-003
          - evidence/AUDIT-001-FACTOR-SURVIVABILITY.md
          - evidence/AUDIT-002-LONG-ONLY.md
          - evidence/AUDIT-003-PRODUCT-UNIVERSE.md
          - evidence/AUDIT-003-DATA-INTEGRITY.md

      FUND_FINANCIAL_STATEMENT_SCREENS:
        family: FUND
        name: Composite financial-statement screens
        disposition: defer
        confidence: moderate
        experiment_candidate: no
        rationale: >-
          Piotroski-style evidence shows accounting information can discriminate
          within constrained universes, but broad finance/accounting anomaly
          replication is weak enough that arbitrary screen construction is a
          high-overfitting path. Revisit only if a specific robust screen survives
          the broader candidate comparison.
        evidence:
          - EV-FUND-FS-001
          - EV-FUND-FS-002

      FUND_EARNINGS_REVISION:
        family: FUND
        name: Earnings surprise and revision underreaction
        disposition: defer
        confidence: moderate
        experiment_candidate: no
        rationale: >-
          PEAD and earnings-revision predictability retain meaningful historical
          and recent evidence, but interpretation is contested by newer work and a
          clean classic test generally requires point-in-time analyst expectations
          such as I/B/E/S. Public substitutes either change the hypothesis or add
          substantial event-data engineering. Under the project's finite-time
          constraint, this does not justify the next experiment.
        evidence:
          - EV-FUND-ER-001
          - EV-FUND-ER-002
          - evidence/SYNTH-002-EARNINGS-VS-TREND.md

      FUND_DISCRETIONARY_STOCK_PICKING:
        family: FUND
        name: Discretionary intrinsic-value stock picking
        disposition: defer
        confidence: high
        experiment_candidate: no
        rationale: >-
          Some professional-manager evidence is consistent with genuine stock-
          picking skill, but aggregate active-manager persistence is weak and no
          generic rule identifies such skill ex ante. The method is also expensive
          in human attention and difficult to falsify cleanly without a much more
          specific process.
        evidence:
          - EV-FUND-DISC-001
          - EV-FUND-DISC-002

      PRICE_CROSS_SECTIONAL_MOMENTUM:
        family: PRICE
        name: Cross-sectional momentum
        disposition: retain
        confidence: high
        experiment_candidate: no
        rationale: >-
          The long-short Mom factor remained positive in AUDIT-001, but the frozen
          AUDIT-002 gate found that the large-stock long-only high-prior-return
          portfolio failed the predeclared benchmark-relative test in both the
          2016+ and 2020+ windows. Momentum remains an empirically credible
          phenomenon, but this representation does not justify immediate deeper
          implementation work for an individual long-only path.
        evidence:
          - EV-PRICE-XMOM-001
          - EV-PRICE-XMOM-002
          - EV-PRICE-XMOM-003
          - EV-PRICE-XMOM-004
          - evidence/AUDIT-001-FACTOR-SURVIVABILITY.md
          - evidence/AUDIT-002-LONG-ONLY.md

      PRICE_TIME_SERIES_TREND:
        family: PRICE
        name: Time-series momentum and diversified trend
        disposition: retain
        confidence: moderate
        experiment_candidate: no
        rationale: >-
          Diversified trend is the strongest accessible surviving candidate from
          the completed historical program. AUDIT-004 Stage A found the official
          AQR aggregate TSMOM factor positive in both the frozen 2013+ and 2020+
          windows. Stage B then found KMLM, a transparent long-term-moving-average
          managed-futures ETF, positive over every predeclared standardized NAV
          horizon currently available. Implementation drag versus the underlying
          index is material and multi-year weak periods remain possible, so this
          evidence does not authorize capital deployment or establish a guaranteed
          premium.
        evidence:
          - EV-PRICE-TSMOM-001
          - EV-PRICE-TSMOM-002
          - EV-PRICE-TSMOM-003
          - evidence/SYNTH-002-EARNINGS-VS-TREND.md
          - evidence/AUDIT-004-STAGE-A.md
          - evidence/AUDIT-004-STAGE-B.md

      PRICE_SHORT_TERM_REVERSAL:
        family: PRICE
        name: Short-term reversal
        disposition: retain
        confidence: moderate
        experiment_candidate: no
        rationale: >-
          Cost-aware historical work and a recent global industry-adjusted result
          suggest the effect can survive modeled trading costs, but it remains
          turnover-intensive and implementation-sensitive enough to rank behind
          slower candidate signals for an individual's first experiment.
        evidence:
          - EV-PRICE-SREV-001
          - EV-PRICE-SREV-002

      PRICE_LONG_TERM_REVERSAL:
        family: PRICE
        name: Long-term reversal
        disposition: defer
        confidence: moderate
        experiment_candidate: no
        rationale: >-
          International evidence supports a long-horizon reversal effect, but
          strength is often concentrated in small stocks or unstable across time.
          The practical case is weaker than value and medium-term momentum.
        evidence:
          - EV-PRICE-LREV-001
          - EV-PRICE-LREV-002

      PRICE_CLASSICAL_TECHNICAL_RULES:
        family: PRICE
        name: Classical chart patterns and indicator-rule mining
        disposition: defer
        confidence: high
        experiment_candidate: no
        rationale: >-
          Objectively defined chart patterns can contain incremental information,
          but information content has not translated into comparably strong
          evidence of durable net profitability. Large-scale rule testing shows
          severe selection, cost, and out-of-sample persistence problems.
        evidence:
          - EV-PRICE-RULE-001
          - EV-PRICE-RULE-002


      EVENT_MERGER_ARBITRAGE:
        family: EVENT
        name: Merger and acquisition arbitrage
        disposition: retain
        confidence: moderate
        experiment_candidate: no
        rationale: >-
          Merger spreads have a coherent mechanism and historical after-cost
          return evidence, but compensation is tied to completion risk, financing
          constraints, and severe downside states. The method also demands
          transaction-specific monitoring, so it does not currently outrank the
          slower and simpler provisional candidates.
        evidence:
          - EV-EVENT-MA-001
          - EV-EVENT-MA-002

      EVENT_SPINOFFS:
        family: EVENT
        name: Spinoffs and restructuring
        disposition: defer
        confidence: moderate
        experiment_candidate: no
        rationale: >-
          Historical abnormal returns exist, but early evidence is conditional on
          takeover activity and long-horizon event-study inference is
          method-sensitive. The current evidentiary base is not clean enough to
          justify a first experiment.
        evidence:
          - EV-EVENT-SPIN-001

      EVENT_REPURCHASES:
        family: EVENT
        name: Post-repurchase underreaction
        disposition: defer
        confidence: moderate
        experiment_candidate: no
        rationale: >-
          Repurchase announcements can convey undervaluation information, but
          claimed long-run abnormal returns are sensitive to event-study
          methodology and often weaken under better-specified calendar-time tests.
        evidence:
          - EV-EVENT-REP-001

      MACRO_CARRY_TERM:
        family: MACRO
        name: Carry and term-structure premia
        disposition: retain
        confidence: moderate
        experiment_candidate: no
        rationale: >-
          Carry has broad cross-asset evidence and a coherent return mechanism,
          but common recession, liquidity, and volatility exposures indicate
          meaningful adverse-state risk. Recent evidence of substantial
          post-publication decay in influential currency carry rules further
          weakens the case for making it the first individual experiment.
        evidence:
          - EV-MACRO-CT-001
          - EV-MACRO-CT-002

      MACRO_DIRECTIONAL_FORECASTING:
        family: MACRO
        name: Directional macro market timing
        disposition: defer
        confidence: high
        experiment_candidate: no
        rationale: >-
          Extended predictor reviews and modern machine-learning tests show that
          strong in-sample aggregate-return forecasts frequently fail out of
          sample. A small set of predictors survives, so predictability is not
          rejected in principle, but generic macro timing is a poor first research
          allocation.
        evidence:
          - EV-MACRO-DF-001
          - EV-MACRO-DF-002

      INFO_ANALYST_ACTIONS:
        family: INFO
        name: Analyst attention and action signals
        disposition: retain
        confidence: low
        experiment_candidate: no
        rationale: >-
          Analyst behavior can contain information about expected returns and
          future fundamentals, but constructing abnormal-attention signals
          requires specialized data and modeling and may overlap with already
          retained fundamental signals. It remains interesting without currently
          warranting a separate experiment.
        evidence:
          - EV-INFO-AA-001

      INFO_NEWS_SENTIMENT:
        family: INFO
        name: News and sentiment processing
        disposition: defer
        confidence: high
        experiment_candidate: no
        rationale: >-
          Textual news and sentiment clearly contain price-relevant information,
          but the most directly predictive versions operate at horizons where
          proprietary data, automated processing, spreads, and execution speed are
          central. That accessibility profile is unattractive for the first
          individual experiment.
        evidence:
          - EV-INFO-NS-001
          - EV-INFO-NS-002
          - EV-INFO-NS-003

  claims: {}

next_action:
  id: HOLD-001
  objective: >-
    Stop active retrospective market-method research and preserve the completed
    evidence state. Return scarce research time to earning or other productive
    work unless a reopening condition is deliberately invoked.
  status: hold
  current_leading_candidate:
    method: PRICE_TIME_SERIES_TREND
    conclusion: >-
      Diversified trend has the strongest combination of historical persistence,
      transparent rules, and accessible implementation found by this program, but
      no capital decision is authorized.
  reopening_conditions:
    - explicit_owner_choice_to_begin_prospective_trend_validation
    - explicit_owner_request_for_separate_capital_allocation_analysis
    - materially_new_evidence_changes_a_deferred_method_ranking
    - substantially_cheaper_clean_test_becomes_available_for_a_deferred_candidate
  prohibited_by_current_state:
    - additional_retrospective_parameter_search
    - paid_data_purchase
    - direct_futures_system_build
    - live_capital_deployment
  completion_condition: >-
    HOLD-001 remains satisfied while no reopening condition has been deliberately
    invoked. Git history and the evidence snapshots preserve the completed
    historical program.
