schema_version: 1

project:
  name: Evidence-Based Market Methods
  status: active
  phase: reconnaissance
  objective: >-
    Determine which, if any, market methods are sufficiently evidence-supported,
    economically exploitable, and practically accessible to an individual to
    merit further experimentation or real-world consideration, given finite time
    and capital.

research:
  status: fund_price_deepening_complete

  reconnaissance:
    universe_version: 1
    classification_principle: >-
      Partition methods primarily by information source or economic mechanism,
      not by marketing label or implementation style, to reduce overlap and
      double-counting.

    evidence_snapshots:
      - evidence/RECON-002-FIRST-PASS.md
      - evidence/RECON-003-FUND-PRICE.md

    method_families:
      BENCH:
        name: Passive market exposure
        role: benchmark
        scope: >-
          Broad, low-cost market exposure used as the default opportunity-cost
          comparator for active methods.

      FUND:
        name: Fundamental corporate information
        role: candidate
        scope: >-
          Methods based on business economics, valuation, accounting information,
          profitability, quality, investment, earnings, revisions, and related
          company fundamentals; includes both discretionary intrinsic-value work
          and systematic fundamental signals.

      PRICE:
        name: Price and volume dynamics
        role: candidate
        scope: >-
          Methods based primarily on historical prices, returns, volume, or market
          action, including momentum, trend, mean reversion, breakouts, indicators,
          chart patterns, and discretionary technical analysis.

      EVENT:
        name: Event-driven and special situations
        role: candidate
        scope: >-
          Methods centered on identifiable corporate or market events such as
          mergers, spinoffs, restructurings, tender offers, earnings events, and
          other discrete catalysts.

      MACRO:
        name: Macro and cross-asset premia
        role: candidate
        scope: >-
          Methods based on macroeconomic conditions, rates, inflation, growth,
          currencies, commodities, carry, term structure, valuation, and tactical
          allocation across asset classes.

      STAT:
        name: Statistical and relative-value relationships
        role: candidate
        scope: >-
          Methods based on repeatable statistical relationships among securities
          or markets, including pairs, cross-sectional models, mean-reverting
          spreads, statistical arbitrage, and other relative-value structures not
          better classified by a more specific information source.

      DERIV:
        name: Derivatives and volatility
        role: candidate
        scope: >-
          Methods whose primary edge or risk exposure arises from options,
          volatility, skew, term structure, convexity, dispersion, or related
          derivative pricing relationships.

      MICRO:
        name: Microstructure and liquidity
        role: candidate
        scope: >-
          Methods based on spreads, order flow, liquidity provision, execution,
          latency, market making, or short-horizon market microstructure effects.

      INFO:
        name: Specialized information and alternative data
        role: candidate
        scope: >-
          Methods based on domain expertise, underfollowed securities, primary
          research, news or sentiment processing, positioning or flow data,
          alternative datasets, or other informational advantages not captured
          above.

    screening_protocol:
      purpose: >-
        Eliminate weak or impractical branches cheaply before authorizing deep
        experiments.

      dimensions:
        - empirical_reality
        - plausible_mechanism
        - out_of_sample_and_post_publication_robustness
        - net_economics_after_costs_and_risk
        - individual_accessibility
        - time_and_learning_cost
        - scalability_and_capacity
        - testability
        - benchmark_comparison

      allowed_dispositions:
        - retain
        - defer
        - reject
        - benchmark_only

      allowed_confidence:
        - high
        - moderate
        - low
        - insufficient

      experiment_candidate_values:
        - provisional
        - no

      comparison_rule: >-
        No family or subfamily earns deep experimentation merely because an effect
        exists. It must also present a plausible, accessible, decision-relevant
        path that can justify the required time, capital, and complexity.

    preliminary_assessments:
      BENCH:
        disposition: benchmark_only
        confidence: high
        rationale: >-
          Low-cost passive exposure is the necessary opportunity-cost baseline.
          Persistent active-manager underperformance makes it inappropriate to
          judge an active method only by whether it has positive raw returns.
        evidence:
          - EV-BENCH-001
          - EV-BENCH-002

      FUND:
        disposition: retain
        confidence: moderate
        rationale: >-
          Valuation, profitability, accounting quality, and earnings-related
          information have substantial empirical support and coherent economic
          links to the underlying businesses, while large anomaly-replication
          exercises show that many individual fundamental signals do not survive.
          The family merits decomposition rather than blanket acceptance.
        evidence:
          - EV-FUND-001
          - EV-FUND-002
          - EV-FUND-003
          - EV-GEN-001

      PRICE:
        disposition: retain
        confidence: high
        rationale: >-
          Momentum and trend persistence have unusually broad evidence, whereas
          large-scale tests of mined technical rules show weak persistence and
          strong cost sensitivity. Retention applies primarily because robust
          price-based subfamilies exist, not because technical analysis as a whole
          is validated.
        evidence:
          - EV-PRICE-001
          - EV-PRICE-002
          - EV-PRICE-003
          - EV-PRICE-004

      EVENT:
        disposition: retain
        confidence: moderate
        rationale: >-
          Post-earnings drift and merger arbitrage have documented mechanisms and
          historical return evidence, but merger spreads embed completion and
          crash risk and several broader corporate-event anomalies weaken under
          better controls. Specific event types must be evaluated separately.
        evidence:
          - EV-EVENT-001
          - EV-EVENT-002
          - EV-EVENT-003
          - EV-EVENT-004

      MACRO:
        disposition: retain
        confidence: moderate
        rationale: >-
          Cross-asset carry, value, and momentum premia have meaningful evidence,
          but generic aggregate-market forecasting has poor out-of-sample history.
          Retention therefore concerns systematic cross-asset premia rather than
          discretionary macro prediction in general.
        evidence:
          - EV-MACRO-001
          - EV-MACRO-002
          - EV-MACRO-003

      STAT:
        disposition: defer
        confidence: moderate
        rationale: >-
          Statistical relative-value effects can exist, but realistic transaction
          costs, shorting requirements, estimation error, and competition make
          individual accessibility uncertain enough that this is not a current
          priority.
        evidence:
          - EV-STAT-001
          - EV-STAT-002

      DERIV:
        disposition: defer
        confidence: high
        rationale: >-
          Volatility and variance risk premia are real and economically meaningful,
          but much of the apparent return is compensation for severe adverse-state
          risk, while option microstructure makes inference and implementation
          unusually demanding. The family is not rejected, but it is a poor early
          use of scarce research time.
        evidence:
          - EV-DERIV-001
          - EV-DERIV-002
          - EV-DERIV-003

      MICRO:
        disposition: defer
        confidence: high
        rationale: >-
          Microstructure frictions and latency effects are real, but direct
          exploitation depends heavily on speed, infrastructure, execution access,
          and specialized competition. Its immediate relevance to an ordinary
          individual is mainly execution quality rather than a primary alpha
          program.
        evidence:
          - EV-MICRO-001
          - EV-MICRO-002

      INFO:
        disposition: retain
        confidence: low
        rationale: >-
          Analyst actions, news, sentiment, and specialized information sometimes
          predict returns, and informational specialization is a plausible source
          of individual advantage. Evidence is heterogeneous, data can be costly,
          and modern competition may erode signals quickly, so accessibility and
          durability remain unresolved.
        evidence:
          - EV-INFO-001
          - EV-INFO-002
          - EV-INFO-003

    subfamily_assessments:
      FUND_VALUE:
        family: FUND
        name: Systematic value and fundamentals-based valuation
        disposition: retain
        confidence: moderate
        experiment_candidate: provisional
        rationale: >-
          Value has broad international evidence and fundamentals-based valuation
          residuals have predicted returns beyond common controls, but long
          horizons, drawdowns, small-stock concentration in some results, risk
          interpretation, and direct post-publication decay reduce confidence that
          historical magnitudes remain exploitable.
        evidence:
          - EV-FUND-VALUE-001
          - EV-FUND-VALUE-002
          - EV-FUND-VALUE-003

      FUND_QUALITY_PROFITABILITY:
        family: FUND
        name: Profitability and quality
        disposition: retain
        confidence: high
        experiment_candidate: provisional
        rationale: >-
          Profitability and composite quality signals have replicated across
          markets and overlap less with distressed-small-stock stories than many
          anomalies. Practical long-only capture and current after-cost magnitude
          still require direct testing.
        evidence:
          - EV-FUND-QP-001
          - EV-FUND-QP-002
          - EV-FUND-QP-003

      FUND_FINANCIAL_STATEMENT_SCREENS:
        family: FUND
        name: Composite financial-statement screens
        disposition: defer
        confidence: moderate
        experiment_candidate: no
        rationale: >-
          Piotroski-style evidence shows accounting information can discriminate
          within constrained universes, but broad finance/accounting anomaly
          replication is weak enough that arbitrary screen construction is a
          high-overfitting path. Revisit only if a specific robust screen survives
          the broader candidate comparison.
        evidence:
          - EV-FUND-FS-001
          - EV-FUND-FS-002

      FUND_EARNINGS_REVISION:
        family: FUND
        name: Earnings surprise and revision underreaction
        disposition: retain
        confidence: high
        experiment_candidate: provisional
        rationale: >-
          Post-earnings-announcement and forecast-revision drift have unusually
          deep literatures and plausible underreaction mechanisms. Accessibility,
          data timing, turnover, and contemporary attenuation remain the main
          unresolved implementation questions.
        evidence:
          - EV-FUND-ER-001
          - EV-FUND-ER-002

      FUND_DISCRETIONARY_STOCK_PICKING:
        family: FUND
        name: Discretionary intrinsic-value stock picking
        disposition: defer
        confidence: high
        experiment_candidate: no
        rationale: >-
          Some professional-manager evidence is consistent with genuine stock-
          picking skill, but aggregate active-manager persistence is weak and no
          generic rule identifies such skill ex ante. The method is also expensive
          in human attention and difficult to falsify cleanly without a much more
          specific process.
        evidence:
          - EV-FUND-DISC-001
          - EV-FUND-DISC-002

      PRICE_CROSS_SECTIONAL_MOMENTUM:
        family: PRICE
        name: Cross-sectional momentum
        disposition: retain
        confidence: high
        experiment_candidate: provisional
        rationale: >-
          Medium-horizon winner-minus-loser continuation is documented in the
          United States and internationally and persists outside only the smallest
          stocks, but turnover, publication-era attenuation, and rare severe
          momentum crashes materially affect implementation.
        evidence:
          - EV-PRICE-XMOM-001
          - EV-PRICE-XMOM-002
          - EV-PRICE-XMOM-003
          - EV-PRICE-XMOM-004

      PRICE_TIME_SERIES_TREND:
        family: PRICE
        name: Time-series momentum and diversified trend
        disposition: retain
        confidence: high
        experiment_candidate: provisional
        rationale: >-
          Trend evidence spans many asset classes and unusually long historical
          samples. However, volatility scaling explains part of reported alpha and
          direct replication can require futures, short exposure, leverage, and
          diversified execution beyond a simple retail chart rule.
        evidence:
          - EV-PRICE-TSMOM-001
          - EV-PRICE-TSMOM-002
          - EV-PRICE-TSMOM-003

      PRICE_SHORT_TERM_REVERSAL:
        family: PRICE
        name: Short-term reversal
        disposition: retain
        confidence: moderate
        experiment_candidate: no
        rationale: >-
          Cost-aware historical work and a recent global industry-adjusted result
          suggest the effect can survive modeled trading costs, but it remains
          turnover-intensive and implementation-sensitive enough to rank behind
          slower candidate signals for an individual's first experiment.
        evidence:
          - EV-PRICE-SREV-001
          - EV-PRICE-SREV-002

      PRICE_LONG_TERM_REVERSAL:
        family: PRICE
        name: Long-term reversal
        disposition: defer
        confidence: moderate
        experiment_candidate: no
        rationale: >-
          International evidence supports a long-horizon reversal effect, but
          strength is often concentrated in small stocks or unstable across time.
          The practical case is weaker than value and medium-term momentum.
        evidence:
          - EV-PRICE-LREV-001
          - EV-PRICE-LREV-002

      PRICE_CLASSICAL_TECHNICAL_RULES:
        family: PRICE
        name: Classical chart patterns and indicator-rule mining
        disposition: defer
        confidence: high
        experiment_candidate: no
        rationale: >-
          Objectively defined chart patterns can contain incremental information,
          but information content has not translated into comparably strong
          evidence of durable net profitability. Large-scale rule testing shows
          severe selection, cost, and out-of-sample persistence problems.
        evidence:
          - EV-PRICE-RULE-001
          - EV-PRICE-RULE-002

  claims: {}

next_action:
  id: RECON-004
  objective: >-
    Deepen the remaining retained families EVENT, MACRO, and INFO just enough to
    determine whether any subfamily deserves to displace or join the provisional
    FUND and PRICE experiment candidates.
  completion_condition: >-
    EVENT, MACRO, and INFO have bounded subfamily assessments under the same
    screening protocol, after which the project can form a cross-family finalist
    set without having overlooked another retained method family. STAT, DERIV, and
    MICRO remain deferred unless new evidence materially changes their expected
    value.
